:root{--ink:#15313d;--muted:#697277;--line:#d9dcdd;--paper:#fdfdfd;--hover:#f1f2f2;--rail:0px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Soehne,Arial,sans-serif;overflow-x:hidden}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- stage ---- */
.workspace{min-height:100%;margin-left:var(--rail);display:grid;place-items:start center;padding-bottom:110px}
.hero{width:min(736px,calc(100vw - var(--rail) - 40px));margin-top:clamp(140px,20vh,240px);text-align:center}

.h1-mask{overflow:hidden;margin:0 0 52px}
h1{font-family:Arizona,Georgia,serif;font-size:31px;font-weight:300;line-height:1.2;letter-spacing:-.5px;margin:0;color:#163541}

.composer{min-height:122px;border:1px solid #d0d3d4;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(10,29,36,.13);display:flex;flex-direction:column;text-align:left;overflow:hidden}
.composer textarea{width:100%;min-height:69px;border:0;outline:0;resize:none;background:transparent;padding:18px 18px 8px;font-size:16px;line-height:1.45}
.composer textarea::placeholder{color:#26434c;opacity:1}
.composer-footer{min-height:51px;display:flex;align-items:center;justify-content:space-between;padding:5px 8px 8px 14px;gap:10px}
.composer-tools{display:flex;align-items:center;gap:4px}
.composer-tools button{border:0;background:transparent;border-radius:7px;display:flex;align-items:center;gap:7px;padding:7px 6px;font-weight:600;font-size:14px;white-space:nowrap}
.composer-tools button:hover{background:var(--hover)}
.composer-tools svg{width:19px;height:19px;color:#667174}
.composer-tools.right{margin-left:auto}
.composer-tools .icon-only{padding:7px}
.composer-tools .send{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:50%;background:#eceeef;color:#a5aaac}
.divider{height:20px;width:1px;background:#daddde;margin:0 4px}
.file-list{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px}
.file-chip{background:#eef2f2;border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}

.security{margin:13px auto 0;display:inline-flex;align-items:center;gap:5px;color:#2f4b54;text-decoration:none;font-size:12px}
.security svg{width:14px;height:14px;color:#6d7779}
.quick-actions{margin:47px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:580px}
.quick-actions button{border:1px solid #d9dcdd;border-radius:8px;background:#fff;padding:10px 13px;display:flex;align-items:center;gap:9px;font-size:15px;box-shadow:0 1px 2px rgba(10,29,36,.04)}
.quick-actions svg,.text-actions svg{width:20px;height:20px}
.purple{color:#8f31b5}.green{color:#11845e}.blue{color:#2b96d3}.cyan{color:#37a9c6}.yellow{color:#efbf20}
.text-actions{display:flex;justify-content:center;gap:43px;margin-top:27px}
.text-actions button{border:0;background:transparent;display:flex;align-items:center;gap:9px;font-size:15px;padding:6px;color:#1f404b}
.text-actions svg{color:#697477}

/* ---- whiteout: the loop's in and out point ---- */
#whiteout{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}

/* ---- toast ---- */
#toast{position:fixed;left:calc(50% + var(--rail)/2);bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 15px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;z-index:20}

/* ---- transport ---- */
.transport{position:fixed;left:var(--rail);right:0;bottom:0;background:rgba(253,253,253,.93);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px;z-index:30}
.transport button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600}
.transport button:hover{border-color:#9ba4a6}
.transport button:focus-visible,.scrub:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.transport .play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:78px}
.transport button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.scrub{flex:1;accent-color:var(--ink);height:4px;cursor:pointer;min-width:80px}
.rate{display:flex;gap:4px;margin-left:auto}
.rate button{padding:8px 10px;min-width:42px}
.act{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);min-width:62px}

@media(max-width:760px){
  .hero{width:calc(100vw - var(--rail) - 24px);margin-top:96px}
  h1{font-size:26px}.h1-mask{margin-bottom:34px}
  .composer-tools button{font-size:0;gap:0}
  .composer-tools button svg{display:block}
  .composer-tools.right button:first-child{display:none}
  .divider{display:none}
  .quick-actions{margin-top:30px}
  .text-actions{gap:14px;flex-wrap:wrap}
  .act,#loop{display:none}
  .rate button{min-width:38px;padding:8px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main class="workspace">
  <section class="hero" id="hero">
    <div class="h1-mask"><h1 id="greeting">Good afternoon Nick, let's get to work</h1></div>

    <form id="prompt-form" class="composer" onsubmit="return false">
      <label class="sr-only" for="prompt">Ask Spellbook</label>
      <textarea id="prompt" rows="3" readonly placeholder="Ask Spellbook to edit, review, or summarize legal documents"></textarea>
      <div id="file-list" class="file-list" aria-live="polite"></div>
      <footer class="composer-footer">
        <div class="composer-tools">
          <button type="button" aria-label="Add files"><span data-icon="paperclip"></span>Add files</button>
          <span class="divider"></span>
          <button type="button" aria-label="Library"><span data-icon="folder"></span>Library</button>
          <button type="button" aria-label="Legal sources"><span data-icon="scales"></span>Legal sources</button>
        </div>
        <div class="composer-tools right">
          <button type="button" aria-label="Prompts"><span data-icon="message"></span>Prompts</button>
          <button type="button" class="icon-only" aria-label="Voice input"><span data-icon="mic"></span></button>
          <button class="send" id="send" type="submit" aria-label="Send prompt"><span data-icon="arrow"></span></button>
        </div>
      </footer>
    </form>

    <a class="security" href="https://www.spellbook.legal/security" target="_blank" rel="noreferrer"><span data-icon="lock"></span>Your data is secure and private in Spellbook</a>

    <div class="quick-actions" aria-label="Common tasks">
      <button><span class="purple" data-icon="edit"></span>Edit documents</button>
      <button><span class="green" data-icon="draft"></span>Draft from precedent</button>
      <button><span class="blue" data-icon="table"></span>Review table</button>
      <button><span class="cyan" data-icon="checklist"></span>Run a playbook</button>
      <button><span class="yellow" data-icon="compare"></span>Compare differences</button>
    </div>

    <div class="text-actions">
      <button><span data-icon="workflow"></span>Explore workflows</button>
      <button><span data-icon="bulb"></span>Try an example</button>
    </div>
  </section>
</main>

<div id="whiteout" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="transport">
  <button class="play" id="play">Pause</button>
  <button id="restart">Restart</button>
  <button id="loop" aria-pressed="true">Loop</button>
  <span class="act" id="actlabel">Boot</span>
  <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub timeline">
  <div class="rate" role="group" aria-label="Playback rate">
    <button data-rate="0.5">0.5&times;</button>
    <button data-rate="1" aria-pressed="true">1&times;</button>
    <button data-rate="2">2&times;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ==========================================================
   ICONS  (carried over from app.js)
========================================================== */
const icons={
  folder:'<path d="M3 7h7l2 2h9v10H3z"/><path d="M6 7V5h6l2 2h7v9"/>',workflow:'<path d="M15 6.5H9.8c-2 0-2.7 2.7-.9 3.7l6.2 3.6c1.8 1 1 3.7-1 3.7H9"/><path d="M15 9V4h5v5zM4 20v-5h5v5z"/>',table:'<path d="M4 4h16v16H4zM10 4v16M4 10h16"/>',paperclip:'<path d="M6 11v4a6 6 0 0 0 12 0V7a4 4 0 0 0-8 0v8a2 2 0 0 0 4 0V7"/>',scales:'<path d="M12 3v17M7 20h10M3 6h6l3-1 3 1h6M6 6l-3 9c2 1 4 1 6 0L6 6zm12 0-3 9c2 1 4 1 6 0l-3-9z"/>',message:'<path d="M4 4h16v14h-5l-3 3-3-3H4zM9 9h6M9 13h6"/>',mic:'<path d="M8 7a4 4 0 0 1 8 0v4a4 4 0 0 1-8 0zM5 15c2 5 12 5 14 0M12 19v2"/>',arrow:'<path d="M12 20V5M6 10l6-6 6 6"/>',lock:'<path d="M5 10h14v11H5zM8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',edit:'<path d="M11 4H4v16h16v-7M9 15v-3l9-9 3 3-9 9z"/>',draft:'<path d="M5 8V3h8l6 6v12H11M13 4v5h5M4 21l3-3v-6a1.5 1.5 0 0 0-3 0v6z"/>',checklist:'<path d="M13 8h7M13 16h7M4 9l1.5 1L9 6M4 17l1.5 1L9 14"/>',compare:'<path d="m11 3 10 1-1.3 13-5.7-.6M3 8l10-1 1.3 13-10 1z"/>',bulb:'<path d="M9 21h6M9 15c-2-1-4-3-4-6a7 7 0 1 1 14 0c0 3-2 5-4 6v3H9z"/>'
};
document.querySelectorAll('[data-icon]').forEach(el=>{
  el.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(icons[el.dataset.icon]||'')+'</svg>';
});

/* ==========================================================
   THE SCRIPT  <-- edit this, everything else follows
========================================================== */
const SCRIPT = {
  prompt: "Review the attached MSA against our vendor playbook. Flag anything that shifts liability onto us, then redline it.",
  files:  ["Acme_Systems_MSA_v3.docx", "Vendor_Playbook_2026.pdf"],
  typeSeconds: 2.6,        // how long the prompt takes to type
  holdSeconds: 0.6,        // beat held on the pressed frame
  fadeSeconds: 0.6         // white-out, both directions
};

const $ = s => document.querySelector(s);
const promptEl = $('#prompt');
const sendEl   = $('#send');
const toastEl  = $('#toast');
const listEl   = $('#file-list');

const PLACEHOLDER = promptEl.placeholder;
const SEND_IDLE   = { bg:'#eceeef', fg:'#a5aaac' };
const SEND_ARMED  = { bg:'#007AFF', fg:'#ffffff' };   // Apple system blue

/* Chips live in the DOM up front. The timeline only reveals them. */
const chipEls = SCRIPT.files.map(name => {
  const c = document.createElement('span');
  c.className = 'file-chip';
  c.textContent = name;
  listEl.appendChild(c);
  return c;
});

/* ==========================================================
   FALLBACK if GSAP never loads
========================================================== */
if (typeof gsap === 'undefined') {
  $('.transport').style.display = 'none';
  $('#whiteout').style.display = 'none';
  promptEl.value = SCRIPT.prompt;
  promptEl.placeholder = '';
  sendEl.style.background = SEND_ARMED.bg;
  sendEl.style.color      = SEND_ARMED.fg;
} else {

/* ==========================================================
   TIMELINE  ·  Boot -> Intent -> Attach -> Send
========================================================== */
gsap.defaults({ ease:'power2.out' });

const typed = { i:0 };
let dragging = false;

function resetFrame(){
  promptEl.value = '';
  promptEl.placeholder = PLACEHOLDER;
  typed.i = 0;
}

const tl = gsap.timeline({
  onUpdate(){
    if (!dragging) $('#scrub').value = this.progress()*1000;
    const l = this.currentLabel();
    if (l) $('#actlabel').textContent = l;
  },
  onRepeat: resetFrame,
  onComplete(){ if (!tl.repeat()) $('#play').textContent = 'Replay'; }
});

/* ---------- ACT 1 · boot (rail excluded, it is already painted) ---------- */
tl.addLabel('Boot')
  .fromTo('#whiteout',
    { opacity:1 },
    { opacity:0, duration: SCRIPT.fadeSeconds, ease:'power2.inOut' })
  .from('#greeting',             { yPercent:110, duration:.7, ease:'power3.out' }, '-=.4')
  .from('.composer',             { y:18, opacity:0, duration:.55 }, '-=.4')
  .from('.security',             { opacity:0, y:6, duration:.35 }, '-=.2')
  .from('.quick-actions button', { opacity:0, y:10, scale:.96, stagger:.055, duration:.4 }, '-=.25')
  .from('.text-actions button',  { opacity:0, y:6, stagger:.08, duration:.35 }, '-=.2');

/* ---------- ACT 2 · the ask types itself ---------- */
tl.addLabel('Intent', '+=.3')
  .call(() => { promptEl.placeholder = ''; })
  .fromTo('.composer',
    { boxShadow:'0 1px 3px rgba(10,29,36,.13)', borderColor:'#d0d3d4' },
    { boxShadow:'0 1px 4px rgba(10,29,36,.2)',  borderColor:'#9ba4a6', duration:.3 })
  .to(typed, {
    i: SCRIPT.prompt.length,
    duration: SCRIPT.typeSeconds,
    ease:'none',
    onUpdate(){
      const n = Math.round(typed.i);
      promptEl.value = SCRIPT.prompt.slice(0, n) + (n < SCRIPT.prompt.length ? '|' : '');
    }
  }, '<');

/* ---------- ACT 3 · files attach ---------- */
tl.addLabel('Attach', '+=.25');
chipEls.forEach(chip => {
  tl.fromTo(chip,
    { opacity:0, scale:.85, y:6 },
    { opacity:1, scale:1, y:0, duration:.35, ease:'back.out(1.7)' }, '+=.12');
});
tl.fromTo(toastEl,
    { opacity:0, y:20 },
    { opacity:1, y:0, duration:.3,
      onStart(){ toastEl.textContent = SCRIPT.files.length + ' files added'; } })
  .to(toastEl, { opacity:0, y:14, duration:.3 }, '+=.9');

/* ---------- ACT 4 · arm, then press. This is the last beat. ---------- */
tl.addLabel('Send')
  .fromTo(sendEl,
    { backgroundColor:SEND_IDLE.bg,  color:SEND_IDLE.fg },
    { backgroundColor:SEND_ARMED.bg, color:SEND_ARMED.fg, duration:.3 })
  .to(sendEl, { scale:1.14, duration:.13, ease:'power2.out' })
  .to(sendEl, { scale:1,    duration:.24, ease:'elastic.out(1,.5)' })
  .fromTo(sendEl.querySelector('svg'),
    { y:0 }, { y:-4, duration:.12, yoyo:true, repeat:1 }, '-=.32')
  .to({}, { duration: SCRIPT.holdSeconds });

/* ---------- ACT 5 · white out, then round again ---------- */
tl.addLabel('Fade')
  .to('#whiteout', { opacity:1, duration: SCRIPT.fadeSeconds, ease:'power2.inOut' })
  .to({}, { duration:.2 });

tl.repeat(-1);   // loop on by default; the Loop button turns it off

/* ==========================================================
   TRANSPORT
========================================================== */
$('#play').addEventListener('click', () => {
  if (!tl.repeat() && tl.progress() === 1) {
    resetFrame(); tl.restart(); $('#play').textContent = 'Pause'; return;
  }
  if (tl.paused()) { tl.play();  $('#play').textContent = 'Pause'; }
  else             { tl.pause(); $('#play').textContent = 'Play';  }
});

$('#restart').addEventListener('click', () => {
  resetFrame();
  tl.restart();
  $('#play').textContent = 'Pause';
});

$('#loop').addEventListener('click', () => {
  const on = $('#loop').getAttribute('aria-pressed') !== 'true';
  $('#loop').setAttribute('aria-pressed', String(on));
  tl.repeat(on ? -1 : 0);
  if (on && tl.progress() === 1) {
    resetFrame(); tl.restart(); $('#play').textContent = 'Pause';
  }
});

const scrub = $('#scrub');
['input','change'].forEach(ev => scrub.addEventListener(ev, () => {
  tl.pause().progress(scrub.value/1000);
  $('#play').textContent = 'Play';
}));
scrub.addEventListener('pointerdown', () => dragging = true);
window.addEventListener('pointerup',   () => dragging = false);

document.querySelectorAll('.rate button').forEach(b => {
  b.addEventListener('click', () => {
    tl.timeScale(Number(b.dataset.rate));
    document.querySelectorAll('.rate button')
      .forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
});

/* Respect the OS setting: land on the finished frame instead of playing. */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  tl.repeat(0).seek('Fade').pause();
  gsap.set('#whiteout', { opacity:0 });
  $('#loop').setAttribute('aria-pressed', 'false');
  $('#play').textContent = 'Replay';
}

} /* end GSAP branch */
</script>
</body>
</html>
