<!--
  Spellbook × Oura Ring 5 — email-capture popup for Webflow.

  HOW TO USE IN WEBFLOW
  1. Add an "Embed" element to the page (or paste this into Pages ▸ (page)
     ▸ Settings ▸ Custom code ▸ "Before </body> tag").
  2. Paste this whole block in.
  3. Open the popup from any element by giving it the attribute:
        data-sb-oura-open
     e.g. a button. Or set AUTO_OPEN_MS below to auto-open after N ms.
  4. Fill in the CONFIG block (HubSpot form GUIDs + field internal names).

  HOW CAPTURE-FIRST WORKS
  - Step 1 (email) submits to HubSpot the instant "Claim" is clicked, via the
    Forms Submission API — so the contact exists even if they abandon Step 2.
    That's your abandonment list; trigger the follow-up email with a HubSpot
    workflow ("email known, Step-2 field blank for 30 min → send email").
  - Step 2 (details) submits to a second form, updating the same contact
    (HubSpot matches on email).
-->
<div class="sb-oura" data-sb-oura-root hidden>
  <div class="sb-oura__overlay" data-sb-oura-close></div>

  <div
    class="sb-oura__card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sb-oura-title"
  >
    <button
      type="button"
      class="sb-oura__x"
      data-sb-oura-close
      aria-label="Close"
    >&times;</button>

    <div class="sb-oura__grid">
      <!-- Left: copy + form -->
      <div class="sb-oura__left">
        <p class="sb-oura__eyebrow">For a limited time</p>
        <h2 id="sb-oura-title" class="sb-oura__title">
          Demo Spellbook, get an Oura Ring 5<span class="sb-oura__star">*</span>
        </h2>
        <p class="sb-oura__sub">
          Because you deserve something back for all those late nights spent
          reviewing contracts.
        </p>

        <!-- STEP 1: email capture -->
        <form class="sb-oura__form" data-sb-oura-step="1" novalidate>
          <label for="sb-oura-email" class="sb-oura__sr">What’s your work email?</label>
          <div class="sb-oura__pill">
            <input
              id="sb-oura-email"
              name="email"
              type="email"
              required
              autocomplete="email"
              inputmode="email"
              placeholder="What’s your work email?"
              class="sb-oura__input"
            />
            <button type="submit" class="sb-oura__btn" data-sb-oura-submit>
              <span data-sb-oura-btnlabel>Claim →</span>
            </button>
          </div>
          <p class="sb-oura__error" data-sb-oura-error role="alert" hidden></p>
        </form>

        <!-- STEP 2: details (shown after Step 1 captures the email) -->
        <form class="sb-oura__form" data-sb-oura-step="2" novalidate hidden>
          <div class="sb-oura__fields">
            <input name="firstname" type="text" autocomplete="given-name"
              placeholder="First name" class="sb-oura__field" required />
            <input name="company" type="text" autocomplete="organization"
              placeholder="Company" class="sb-oura__field" required />
          </div>
          <button type="submit" class="sb-oura__btn sb-oura__btn--wide" data-sb-oura-submit>
            <span data-sb-oura-btnlabel>Book my demo →</span>
          </button>
          <p class="sb-oura__error" data-sb-oura-error role="alert" hidden></p>
        </form>

        <!-- SUCCESS -->
        <div class="sb-oura__done" data-sb-oura-done hidden>
          <p class="sb-oura__doneTitle">You’re in. 🎉</p>
          <p class="sb-oura__sub">Check your inbox — we’ll be in touch to book your demo.</p>
        </div>

        <p class="sb-oura__terms">
          *Terms and condition apply. Offer valid for businesses only.
        </p>
      </div>

      <!-- Right: product panel -->
      <div class="sb-oura__right">
        <img
          class="sb-oura__rings"
          src="https://nicholasrocha.com/oura/rings.webp"
          alt="Six Oura Ring 5 smart rings arranged in a circle"
          loading="eager"
          decoding="async"
        />
      </div>
    </div>
  </div>
</div>

<style>
  .sb-oura{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;
    font-family:'Söhne','Soehne',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
  .sb-oura[data-open]{display:flex;}
  .sb-oura *{box-sizing:border-box;}
  .sb-oura__overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(2px);}
  .sb-oura__card{position:relative;width:100%;max-width:960px;overflow:hidden;border-radius:20px;
    border:1px solid rgba(255,255,255,.10);background:#111315;color:#fff;
    box-shadow:0 30px 80px rgba(0,0,0,.55);}
  .sb-oura__x{position:absolute;top:14px;right:16px;z-index:2;width:34px;height:34px;border:0;cursor:pointer;
    border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;line-height:1;}
  .sb-oura__x:hover{background:rgba(255,255,255,.16);}
  .sb-oura__grid{display:grid;grid-template-columns:1fr 1fr;}
  .sb-oura__left{display:flex;flex-direction:column;gap:22px;padding:44px;}
  .sb-oura__eyebrow{margin:0;font-size:14px;font-weight:500;color:rgba(255,255,255,.5);}
  .sb-oura__title{margin:0;font-size:44px;line-height:1.05;font-weight:500;letter-spacing:-.01em;
    font-family:'ABC Arizona Mix','ABC Arizona','Arizona',Georgia,'Times New Roman',serif;}
  .sb-oura__star{color:#F94E1D;}
  .sb-oura__sub{margin:0;font-size:18px;line-height:1.5;color:rgba(255,255,255,.6);max-width:30rem;}
  .sb-oura__form{margin:0;width:100%;}
  .sb-oura__pill{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);}
  .sb-oura__pill:focus-within{border-color:rgba(255,255,255,.30);background:rgba(255,255,255,.10);}
  .sb-oura__input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;
    padding:10px 16px;font-size:16px;font-family:inherit;}
  .sb-oura__input::placeholder{color:rgba(255,255,255,.4);}
  /* keep the field dark when the browser autofills */
  .sb-oura__input:-webkit-autofill,.sb-oura__input:-webkit-autofill:hover,
  .sb-oura__input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;
    transition:background-color 100000s ease-in-out 0s;}
  .sb-oura__btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    border:0;border-radius:8px;background:#F94E1D;color:#fff;font-family:inherit;font-size:16px;font-weight:500;
    padding:10px 20px;transition:opacity .15s;}
  .sb-oura__btn:hover{opacity:.9;}
  .sb-oura__btn[disabled]{opacity:.7;cursor:not-allowed;}
  .sb-oura__btn--wide{width:100%;margin-top:12px;padding:14px 20px;}
  .sb-oura__fields{display:flex;flex-direction:column;gap:10px;}
  .sb-oura__field{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.05);color:#fff;padding:14px 16px;font-size:16px;font-family:inherit;outline:0;}
  .sb-oura__field:focus{border-color:rgba(255,255,255,.30);}
  .sb-oura__field::placeholder{color:rgba(255,255,255,.4);}
  .sb-oura__error{margin:12px 0 0;font-size:14px;color:#ff8a6b;}
  .sb-oura__done{padding:6px 0;}
  .sb-oura__doneTitle{margin:0 0 6px;font-size:22px;font-weight:600;}
  .sb-oura__terms{margin:0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.4);}
  .sb-oura__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .sb-oura__right{position:relative;overflow:hidden;
    background:radial-gradient(120% 90% at 62% 42%,#1b1f22 0%,#050607 72%);}
  .sb-oura__rings{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:40px;}
  .sb-oura__spin{width:16px;height:16px;border-radius:999px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;display:inline-block;animation:sbOuraSpin .7s linear infinite;}
  @keyframes sbOuraSpin{to{transform:rotate(360deg)}}
  @media (max-width:760px){
    .sb-oura__grid{grid-template-columns:1fr;min-width:0;}
    .sb-oura__right{display:none;}
    .sb-oura__left{padding:32px 24px;gap:18px;min-width:0;}
    .sb-oura__title{font-size:34px;}
    .sb-oura__sub{font-size:16px;}
    /* stack the email field and Claim button so the pill never overflows */
    .sb-oura__pill{flex-direction:column;align-items:stretch;gap:8px;}
    .sb-oura__btn{width:100%;padding:14px 20px;}
  }
</style>

<script>
(function () {
  /* ============================ CONFIG ============================ */
  var CONFIG = {
    portalId: '20853254',
    // Step 1 form (email only) — the guaranteed capture on "Claim":
    step1FormGuid: '5cde2ecd-ff63-44ff-9e4f-c3ff2dc37fb2',
    // Step 2 form (details) — TODO: paste the second form's GUID:
    step2FormGuid: 'REPLACE_WITH_STEP_2_FORM_GUID',
    // Internal field names as defined in HubSpot (edit if yours differ):
    emailField: 'email',
    autoOpenMs: 0,           // e.g. 4000 to auto-open after 4s; 0 = off
    openOncePerSession: true // don't reopen after close within the session
  };
  /* ================================================================ */

  var root = document.querySelector('[data-sb-oura-root]');
  if (!root) return;
  var step1 = root.querySelector('[data-sb-oura-step="1"]');
  var step2 = root.querySelector('[data-sb-oura-step="2"]');
  var done  = root.querySelector('[data-sb-oura-done]');
  var emailInput = root.querySelector('#sb-oura-email');
  var lastFocus = null;
  var captured = { }; // holds the email between steps

  function getCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? m.pop() : '';
  }

  function open() {
    if (root.hasAttribute('data-open')) return;
    lastFocus = document.activeElement;
    root.setAttribute('data-open', '');
    root.removeAttribute('hidden');
    document.documentElement.style.overflow = 'hidden';
    setTimeout(function () { emailInput && emailInput.focus(); }, 30);
  }
  function close() {
    root.removeAttribute('data-open');
    root.setAttribute('hidden', '');
    document.documentElement.style.overflow = '';
    if (CONFIG.openOncePerSession) { try { sessionStorage.setItem('sbOuraSeen', '1'); } catch (e) {} }
    lastFocus && lastFocus.focus && lastFocus.focus();
  }

  // HubSpot Forms Submission API (public endpoint — safe from the browser)
  function hsSubmit(formGuid, fields) {
    var body = {
      fields: Object.keys(fields).map(function (k) { return { name: k, value: fields[k] }; }),
      context: { pageUri: location.href, pageName: document.title }
    };
    var hutk = getCookie('hubspotutk');
    if (hutk) body.context.hutk = hutk;
    return fetch(
      'https://api.hsforms.com/submissions/v3/integration/submit/' + CONFIG.portalId + '/' + formGuid,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    ).then(function (r) { return r.ok; }).catch(function () { return false; });
  }

  function setLoading(form, on, loadingText) {
    var btn = form.querySelector('[data-sb-oura-submit]');
    var label = btn.querySelector('[data-sb-oura-btnlabel]');
    btn.disabled = on;
    if (on) { label.innerHTML = '<span class="sb-oura__spin"></span> ' + (loadingText || 'Sending…'); }
    else { label.textContent = form === step1 ? 'Claim →' : 'Book my demo →'; }
  }
  function showError(form, msg) {
    var el = form.querySelector('[data-sb-oura-error]');
    el.textContent = msg; el.hidden = false;
  }
  function clearError(form) {
    var el = form.querySelector('[data-sb-oura-error]');
    el.textContent = ''; el.hidden = true;
  }

  // STEP 1 — capture the email immediately
  step1.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError(step1);
    var email = (emailInput.value || '').trim();
    if (!email || !emailInput.checkValidity()) {
      showError(step1, 'Please enter a valid work email address.');
      emailInput.reportValidity();
      return;
    }
    captured[CONFIG.emailField] = email;
    setLoading(step1, true, 'Claiming…');
    var fields = {}; fields[CONFIG.emailField] = email;
    hsSubmit(CONFIG.step1FormGuid, fields).then(function () {
      // Best-effort capture: advance regardless so a network hiccup never
      // blocks the user (Step 2 re-sends the email too).
      setLoading(step1, false);
      step1.hidden = true;
      step2.hidden = false;
      var first = step2.querySelector('input'); first && first.focus();
    });
  });

  // STEP 2 — enrich the same contact
  step2.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError(step2);
    var fields = {};
    fields[CONFIG.emailField] = captured[CONFIG.emailField] || '';
    var ok = true;
    step2.querySelectorAll('input[name]').forEach(function (inp) {
      if (inp.required && !inp.value.trim()) ok = false;
      fields[inp.name] = inp.value.trim();
    });
    if (!ok) { showError(step2, 'Please fill in the required fields.'); return; }
    if (CONFIG.step2FormGuid === 'REPLACE_WITH_STEP_2_FORM_GUID') {
      showError(step2, 'Step 2 form GUID not set yet.');
      return;
    }
    setLoading(step2, true, 'Booking…');
    hsSubmit(CONFIG.step2FormGuid, fields).then(function (sent) {
      setLoading(step2, false);
      if (!sent) { showError(step2, 'Something went wrong — please try again.'); return; }
      step2.hidden = true;
      done.hidden = false;
    });
  });

  // Open/close wiring
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-sb-oura-open]')) { e.preventDefault(); open(); }
    else if (e.target.closest('[data-sb-oura-close]')) { e.preventDefault(); close(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && root.hasAttribute('data-open')) close();
  });

  // Auto-open (optional)
  if (CONFIG.autoOpenMs > 0) {
    var seen = false;
    try { seen = CONFIG.openOncePerSession && sessionStorage.getItem('sbOuraSeen') === '1'; } catch (e) {}
    if (!seen) setTimeout(open, CONFIG.autoOpenMs);
  }
})();
</script>
